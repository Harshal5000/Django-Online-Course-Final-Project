<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OnlineCourse · {% block title %}Learn{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb}.hero{background:linear-gradient(120deg,#172a63,#215bd5);color:#fff;border-radius:20px}.card{border:0;box-shadow:0 6px 28px #15254e13;border-radius:16px}.mark-pill{font-size:.85rem;font-weight:600;background:#eaf0ff;color:#2449a9;padding:5px 12px;border-radius:999px}</style></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'onlinecourse:course_list' %}">📘 OnlineCourse</a><span class="text-white-50">{% if user.is_authenticated %}{{ user.username }} · <a class="text-white" href="{% url 'admin:index' %}">Admin</a>{% else %}<a class="text-white" href="{% url 'admin:login' %}">Log in</a>{% endif %}</span></div></nav><main class="container py-5">{% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
